<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="เว็บไซต์แนะนำตัวและผลงานของเจนจิรา แก้วแกมจันทร์"
    />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <a class="brand" href="#about">My Portfolio</a>
        <nav aria-label="เมนูหลัก">
          <a href="#about">เกี่ยวกับฉัน</a>
          <a href="#skills">ทักษะ</a>
          <a href="#projects">ผลงาน</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="profile-card" id="about" aria-labelledby="profile-title">
        <img
          src="images/2.jpg"
          alt="มีแอนมี"
          class="profile-pic"
        />
        <h1 id="profile-title">My Profile</h1>
        <div class="profile-details">
          <p>ชื่อ-นามสกุล: <span id="fullname">เจนจิรา แก้วแกมจันทร์</span></p>
          <p>ชื่อเล่น: <span id="nickname">เจน</span></p>
          <p>รหัสประจำตัว: <span id="studentID">68219010004</span></p>
        </div>

        <div class="motto">
          <h2>คติประจำใจ</h2>
          <p id="motto">นอนก่อน ค่อยว่ากัน</p>
        </div>

        <button id="greetingBtn" type="button">ทักทาย</button>
        <p id="greetingMessage" aria-live="polite">สวัสดีจ้าา</p>
      </section>

      <section class="content-card" id="skills" aria-labelledby="skills-title">
        <h2 id="skills-title">ทักษะที่สนใจ</h2>
        <ul class="skills-list">
          <li>นอน</li>
        </ul>
      </section>

      <section class="content-card" id="projects" aria-labelledby="projects-title">
        <h2 id="projects-title">ผลงานของฉัน</h2>
        <article class="project">
          <h3>-</h3>  
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <p>My Developer Portfolio</p>
      <p>สร้างด้วย HTML และ CSS</p>
    </footer>
  </body>
</html>
